name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Native arm64 wheels match the tutorial's supported environment.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Lint Python and notebook code
        run: make lint
      - name: Validate notebook structure
        run: uv run --locked python scripts/check_notebooks.py
      # Metal model tests and notebook execution run locally on Apple Silicon.
      - name: Test data generation and loading
        run: uv run --locked python -m pytest -q tests/test_data.py
